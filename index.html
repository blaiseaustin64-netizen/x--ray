<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <meta name="description" content="VEXDYN X-Ray — Diagnose any website in seconds. Performance, SEO, accessibility, security and more." />
  <title>VEXDYN X-Ray</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2362e6ff'/%3E%3Cpath d='M8 16h4l3-8 4 16 3-8h4' stroke='%2304202a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12h4l3-9 4 18 3-9h4"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">VEXDYN</span>
            <span class="brand-tag">X-Ray</span>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- ========== IDLE ========== -->
      <section class="view active" data-view="idle" aria-label="Start scan">
        <div class="hero">
          <h1>See through any <span>website</span></h1>
          <p>Paste a URL. Watch X-Ray diagnose performance, SEO, security, and more — in one cinematic pass.</p>
        </div>

        <div class="url-bar">
          <label class="sr-only" for="url-input">Website URL</label>
          <input
            id="url-input"
            type="text"
            data-url-input
            value="yourbusiness.com"
            placeholder="yourbusiness.com"
            autocomplete="url"
            spellcheck="false"
          />
          <button type="button" class="scan-btn" data-scan-btn>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M3 12h4l3-9 4 18 3-9h4"/>
            </svg>
            Scan
          </button>
        </div>
        <p class="hint">No account required · Demo data for now</p>
      </section>

      <!-- ========== SCANNING ========== -->
      <section class="view" data-view="scanning" aria-label="Scanning" aria-live="polite">
        <div class="scan-viewport" data-scan-viewport>
          <div class="mock-site" aria-hidden="true">
            <div class="mock-nav"></div>
            <div class="mock-hero"></div>
            <div class="mock-img"></div>
            <div class="mock-lines">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="mock-cta"></div>
          </div>

          <div class="scan-grid"></div>
          <div class="scan-vignette"></div>
          <div class="scan-beam"></div>

          <!-- Callouts (populated live) -->
          <div class="callout c1" data-callout="c1"></div>
          <div class="callout c2" data-callout="c2"></div>
          <div class="callout c3" data-callout="c3"></div>
          <div class="callout c4" data-callout="c4"></div>
          <div class="callout c5" data-callout="c5"></div>
        </div>

        <div class="scan-status" data-scan-status>
          <span class="dot"></span> SCANNING
        </div>
        <div class="scan-phase" data-scan-phase></div>
        <div class="scan-progress">
          <div class="scan-progress-bar" data-scan-progress></div>
        </div>
      </section>

      <!-- ========== RESULTS ========== -->
      <section class="view" data-view="results" aria-label="X-Ray report">
        <div class="results-header">
          <div class="results-brand">VEXDYN X-RAY REPORT</div>
          <div class="score-wrap">
            <div class="score-ring" data-score-ring style="--score-pct: 0%; --score-color: var(--scan)">
              <div class="score-inner">
                <div class="score-num" data-score-num>0</div>
                <div class="score-denom" data-score-label>out of 100</div>
              </div>
            </div>
          </div>
          <div class="score-verdict warn" data-score-verdict>—</div>
          <p class="roast" data-roast></p>
          <div class="tags" data-tags></div>
          <p style="font-size:12px;color:var(--muted);margin-bottom:8px">
            <span data-result-url></span>
          </p>
        </div>

        <div class="categories" data-categories></div>

        <div class="findings-section">
          <div class="section-title">Findings</div>
          <div data-findings></div>
        </div>

        <div class="results-actions">
          <button type="button" class="btn btn-secondary" data-scan-again>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6M23 20v-6h-6"/>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
            Scan again
          </button>
          <button type="button" class="btn btn-primary" data-share>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
            </svg>
            Share report
          </button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
